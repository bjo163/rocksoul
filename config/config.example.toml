[core]
name = "Rocksoul"
profile = "seed"

[model]
# Provider credentials and endpoint are configured in the root .env file.
provider = "openai-compatible"

[storage]
# All paths are relative to the Rocksoul installation root.
root = "."

[evolution]
enabled = false
automatic_promotion = false

# Reserved for a future reviewed OS isolation backend. No backend is enabled;
# a missing, malformed, or unsupported policy always fails closed.
# [sandbox]
# backend = "linux-namespaces"
# scratch_root = "./workspace/sandbox"
# allow_network = false
# read_only_root = true

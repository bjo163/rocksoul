[package]
name = "rocksoul"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-first, CLI-native intelligence runtime designed for gradual evolution."
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dotenvy = "0.15.7"
fs2 = "0.4.3"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-std", "io-util"] }

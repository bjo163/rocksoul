type:docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'README.md'
          - 'CONTRIBUTING.md'
          - 'SECURITY.md'
          - 'CODE_OF_CONDUCT.md'

type:maintenance:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rust-toolchain.toml'
          - 'vercel.json'

area:ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'
          - '.github/*.json'

area:web:
  - changed-files:
      - any-glob-to-any-file:
          - 'public/**'
          - 'vercel.json'

area:storage:
  - changed-files:
      - any-glob-to-any-file:
          - 'data/**'
          - 'docs/STORAGE.md'

area:core:
  - changed-files:
      - any-glob-to-any-file: ['crates/rocksoul-core/**']


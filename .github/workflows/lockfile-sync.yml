name: Sync Cargo.lock

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lockfile-sync.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve and propose Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Create lockfile pull request when changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/commit-cargo-lock
          delete-branch: true
          commit-message: "chore: commit resolved Cargo.lock"
          title: "chore: commit resolved Cargo.lock"
          body: |
            ## Purpose
            Commit the Cargo dependency resolution generated by stable Cargo on GitHub Actions.

            ## Validation
            The lockfile is generated from the current `main` Cargo.toml. CI will validate it after this PR is opened.

            This PR is intentionally limited to Cargo.lock.
          add-paths: Cargo.lock

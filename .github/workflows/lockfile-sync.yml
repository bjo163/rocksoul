name: Sync Cargo.lock

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/lockfile-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve and publish lockfile task branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependency lockfile
        run: cargo generate-lockfile

      - name: Push lockfile branch when changed
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current; no branch is needed."
            exit 0
          fi

          branch="chore/commit-cargo-lock-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit -m "chore: commit resolved Cargo.lock"
          git push origin "HEAD:refs/heads/$branch"

          echo "Lockfile branch pushed: $branch"
          echo "Open a pull request from this branch to main. Do not push directly to main."

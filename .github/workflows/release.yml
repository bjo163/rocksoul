name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Publish Windows production release
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --locked --release

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/rocksoul.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  rocksoul.exe" | Out-File -FilePath target/release/rocksoul.exe.sha256 -Encoding ascii

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ steps.meta.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\rocksoul.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble portable folder and ZIP
        shell: powershell
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "v$version"
          $root = "dist\Rocksoul-$tag"
          New-Item -ItemType Directory -Force -Path "$root\config", "$root\data", "$root\cache", "$root\workspace", "$root\evolution", "$root\logs" | Out-Null
          Copy-Item target\release\rocksoul.exe $root
          Copy-Item .env.example "$root\.env.example"
          Copy-Item config\config.example.toml "$root\config\config.example.toml"
          Copy-Item README.md $root
          Compress-Archive -Path "$root\*" -DestinationPath "dist\Rocksoul-$tag-windows-x64-portable.zip" -Force

      - name: Publish GitHub Release and create version tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rocksoul v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/rocksoul.exe
            target/release/rocksoul.exe.sha256
            dist/Rocksoul-Setup-${{ steps.meta.outputs.version }}-x64.exe
            dist/Rocksoul-v${{ steps.meta.outputs.version }}-windows-x64-portable.zip

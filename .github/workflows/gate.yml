name: rocksoul-gate

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '31 20 * * 3'
  workflow_dispatch:

concurrency:
  group: rocksoul-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  security-events: write

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Branch and repository policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            head='${{ github.head_ref }}'
            case "$head" in
              dev|feature/*|dependabot/*) ;;
              *) echo "::error::Human branches must be dev or feature/* (Dependabot is the only bot exception). Got: $head"; exit 1 ;;
            esac
          fi
          python -m json.tool .github/labels.json >/dev/null
          python -m json.tool .github/milestones.json >/dev/null
          python -m json.tool .github/roadmap-issues.json >/dev/null
          test -f public/brand.env
          test -f public/index.html
          test -f data/public/README.md
          test -f docs/STORAGE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/TEMPLATE.md

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Generate lockfile for audit
        run: cargo generate-lockfile
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: RustSec audit
        run: cargo audit

  dependency-review:
    name: dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --exclude 'https://github\.com/bjo163/rocksoul/(wiki|discussions)(/.*)?$'
            **/*.md
          fail: true
      - name: Web surface smoke
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^NAME=RockSoul$' public/brand.env
          grep -q 'brand.env' public/index.html
          grep -q 'outputDirectory' vercel.json

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:rust'

  create-release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [policy, rust, docs, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "RockSoul $GITHUB_REF_NAME" \
              --generate-notes
          fi

  release-binaries:
    name: release-${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: rocksoul-linux-x86_64.tar.gz
            binary: rocksoul
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: rocksoul-windows-x86_64.zip
            binary: rocksoul.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: rocksoul-macos-arm64.tar.gz
            binary: rocksoul
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install target
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Build
        shell: bash
        run: cargo build --release -p rocksoul-tui --target '${{ matrix.target }}'
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C 'target/${{ matrix.target }}/release' -czf '${{ matrix.archive }}' '${{ matrix.binary }}'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'target/${{ matrix.target }}/release/${{ matrix.binary }}' -DestinationPath '${{ matrix.archive }}'
      - name: Publish binary asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload '${{ github.ref_name }}' '${{ matrix.archive }}' --repo "$GITHUB_REPOSITORY" --clobber

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Run offline core integrity evaluation
        run: cargo run --locked -- eval run core

      - name: Run offline memory retrieval evaluation
        run: cargo run --locked -- eval run memory-retrieval

      - name: Upload memory retrieval evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: memory-retrieval-evaluation
          path: target/debug/data/evaluations/memory-retrieval/latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

  windows-build:
    name: Build, package, and smoke-test Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --locked --release

      - name: Run Windows tests
        run: cargo test --locked --all-targets --all-features

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer and portable ZIP
        shell: powershell
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          "ROCKSOUL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\rocksoul.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "dist\Rocksoul-$version"
          New-Item -ItemType Directory -Force -Path "$root\config", "$root\data", "$root\cache", "$root\workspace", "$root\evolution", "$root\logs" | Out-Null
          Copy-Item target\release\rocksoul.exe $root
          Copy-Item .env.example "$root\.env.example"
          Copy-Item config\config.example.toml "$root\config\config.example.toml"
          Copy-Item README.md $root
          Compress-Archive -Path "$root\*" -DestinationPath "dist\Rocksoul-$version-windows-x64-portable.zip" -Force

      - name: Smoke-test portable ZIP on a clean Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $portableRoot = Join-Path $env:RUNNER_TEMP "rocksoul-portable-smoke"
          $portableZip = "dist\Rocksoul-$env:ROCKSOUL_VERSION-windows-x64-portable.zip"
          Expand-Archive -Path $portableZip -DestinationPath $portableRoot -Force
          $exe = Join-Path $portableRoot "rocksoul.exe"
          if (!(Test-Path $exe)) { throw "Portable ZIP is missing rocksoul.exe" }

          Push-Location $portableRoot
          try {
            & $exe init
            if ($LASTEXITCODE -ne 0) { throw "Portable init failed" }
            foreach ($path in @(".env", "config/config.toml", "data/identity/rid.json", "data/memory/store.v4.json")) {
              if (!(Test-Path (Join-Path $portableRoot $path))) { throw "Missing initialized path: $path" }
            }

            Add-Content .env "# smoke-test-preserve"
            Add-Content config/config.toml "# smoke-test-preserve"
            & $exe init
            if ($LASTEXITCODE -ne 0) { throw "Second portable init failed" }
            if (!(Select-String -Path .env -SimpleMatch "# smoke-test-preserve" -Quiet)) { throw ".env was overwritten by init" }
            if (!(Select-String -Path config/config.toml -SimpleMatch "# smoke-test-preserve" -Quiet)) { throw "config.toml was overwritten by init" }

            & $exe status
            if ($LASTEXITCODE -ne 0) { throw "Portable status failed" }
            & $exe doctor
            if ($LASTEXITCODE -ne 0) { throw "Portable doctor failed" }
            & $exe rid status
            if ($LASTEXITCODE -ne 0) { throw "Portable RID status failed" }
            & $exe eval run core
            if ($LASTEXITCODE -ne 0) { throw "Portable core evaluation failed" }
            & $exe eval run memory-retrieval
            if ($LASTEXITCODE -ne 0) { throw "Portable memory retrieval evaluation failed" }
            & $exe memory add semantic --content "portable smoke test record"
            if ($LASTEXITCODE -ne 0) { throw "Portable memory write failed" }
            & $exe memory list
            if ($LASTEXITCODE -ne 0) { throw "Portable memory list failed" }

            $proposalOutput = & $exe memory propose semantic --content "approved model proposal smoke" --source-turn-reference "ci:windows-smoke" --provenance "windows-smoke-model"
            if ($LASTEXITCODE -ne 0) { throw "Portable memory proposal creation failed" }
            $proposalId = (($proposalOutput | Select-String '^Proposal: ').ToString() -replace '^Proposal: ', '')
            $fingerprint = (($proposalOutput | Select-String '^Fingerprint: ').ToString() -replace '^Fingerprint: ', '')
            if (!$proposalId -or !$fingerprint) { throw "Memory proposal ID/fingerprint missing" }
            $approvalPhrase = "APPROVE $proposalId $fingerprint"
            $approvalFile = Join-Path $env:RUNNER_TEMP "rocksoul-memory-approval.txt"
            [System.IO.File]::WriteAllText($approvalFile, $approvalPhrase + [Environment]::NewLine, [System.Text.Encoding]::ASCII)
            $approvalProcess = Start-Process -FilePath $exe -ArgumentList @("memory", "approve", $proposalId) -RedirectStandardInput $approvalFile -NoNewWindow -Wait -PassThru
            Remove-Item $approvalFile -Force
            if ($approvalProcess.ExitCode -ne 0) { throw "Portable memory proposal approval failed" }
            $memoryList = & $exe memory list
            if ($LASTEXITCODE -ne 0) { throw "Portable memory list after proposal approval failed" }
            if (!(($memoryList -join "`n").Contains("model_proposal:$proposalId"))) { throw "Approved proposal provenance missing from memory" }

            $deniedOutput = & $exe memory propose semantic --content "denied proposal must not persist" --source-turn-reference "ci:windows-deny" --provenance "windows-smoke-model"
            if ($LASTEXITCODE -ne 0) { throw "Portable denied memory proposal creation failed" }
            $deniedId = (($deniedOutput | Select-String '^Proposal: ').ToString() -replace '^Proposal: ', '')
            & $exe memory deny $deniedId
            if ($LASTEXITCODE -ne 0) { throw "Portable memory proposal denial failed" }
            $memoryList = & $exe memory list
            if (($memoryList -join "`n").Contains("denied proposal must not persist")) { throw "Denied proposal was persisted as memory" }

            $workspaceCommand = 'echo WRITE windows-smoke.txt | "' + $exe + '" workspace write windows-smoke.txt --content "Windows workspace smoke artifact"'
            cmd.exe /d /c $workspaceCommand
            if ($LASTEXITCODE -ne 0) { throw "Approved workspace artifact write failed" }
            $artifact = Join-Path $portableRoot "workspace/windows-smoke.txt"
            if (!(Test-Path $artifact)) { throw "Workspace artifact was not created" }
            if ((Get-Content $artifact -Raw) -ne "Windows workspace smoke artifact") { throw "Workspace artifact read-back mismatch" }
            & $exe workspace trace
            if ($LASTEXITCODE -ne 0) { throw "Workspace task trace inspection failed" }
          }
          finally {
            Pop-Location
          }

      - name: Smoke-test installer install, initialize, and uninstall preservation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:RUNNER_TEMP "rocksoul-installer-smoke"
          $installer = "dist\Rocksoul-Setup-$env:ROCKSOUL_VERSION-x64.exe"
          if (!(Test-Path $installer)) { throw "Installer artifact not found: $installer" }

          $process = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }

          $exe = Join-Path $installRoot "rocksoul.exe"
          if (!(Test-Path $exe)) { throw "Installed executable is missing" }
          Push-Location $installRoot
          try {
            & $exe init
            if ($LASTEXITCODE -ne 0) { throw "Installed init failed" }
            Add-Content .env "# uninstall-preserve"
            Add-Content config/config.toml "# uninstall-preserve"
            & $exe status
            if ($LASTEXITCODE -ne 0) { throw "Installed status failed" }
          }
          finally {
            Pop-Location
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Inno Setup uninstaller not found" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          if (!(Test-Path (Join-Path $installRoot ".env"))) { throw "Uninstall removed user .env" }
          if (!(Test-Path (Join-Path $installRoot "config/config.toml"))) { throw "Uninstall removed user config" }

      - name: Upload rocksoul.exe
        uses: actions/upload-artifact@v4
        with:
          name: rocksoul-windows-x64
          path: target/release/rocksoul.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rocksoul-windows-installer
          path: dist/Rocksoul-Setup-${{ env.ROCKSOUL_VERSION }}-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rocksoul-windows-portable
          path: dist/Rocksoul-${{ env.ROCKSOUL_VERSION }}-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

name: stale

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark inactive work
        uses: actions/stale@v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: 'This issue has had no activity for 90 days. Remove `stale` or add current evidence/context if it is still actionable.'
          close-issue-message: 'Closed after the stale grace period. Reopen with fresh evidence/context if the work becomes actionable again.'
          stale-pr-message: 'This PR has had no activity for 45 days. Please rebase/update or explain why it should remain open.'
          close-pr-message: 'Closed after the stale grace period. A refreshed PR can be opened when the change is active again.'
          exempt-issue-labels: 'roadmap,type:security,priority:p0,priority:p1,status:blocked'
          exempt-pr-labels: 'type:security,priority:p0,priority:p1'
          operations-per-run: 100

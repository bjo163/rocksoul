name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
labels:
  - type:bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, errors, commit SHA, screenshots, or test output. Remove secrets.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Rust version, terminal, commit SHA
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and sensitive data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true

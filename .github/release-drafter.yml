name-template: 'Next RockSoul age release'
tag-template: 'draft-$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No user-visible changes'
exclude-labels:
  - 'release:skip'
categories:
  - title: '🚀 Runtime & Features'
    labels: ['type:feature']
  - title: '🖥️ TUI / Web'
    labels: ['area:tui', 'area:web']
  - title: '💾 Storage & Data'
    labels: ['area:storage']
  - title: '🐛 Fixes'
    labels: ['type:bug']
  - title: '🔐 Security'
    labels: ['type:security']
  - title: '📚 Documentation'
    labels: ['type:docs']
  - title: '🧰 Maintenance'
    labels: ['type:maintenance', 'dependencies']
version-resolver:
  major:
    labels: ['breaking-change']
  minor:
    labels: ['type:feature']
  patch:
    labels: ['type:bug', 'type:security', 'type:maintenance', 'dependencies', 'type:docs']
  default: patch
template: |
  ## Changes
  $CHANGES

  ## Distribution
  Public versions are not taken from this draft's semantic placeholder. When a build is worth publishing, run `rocksoul-sync` with `publish_age_release=true`. The resulting `v0.<cognitive-age>.<revision>` tag is validated and packaged by `rocksoul-gate`.

  ## Artifacts
  Tag releases are expected to include Linux x86_64, Windows x86_64 (`rocksoul.exe`) and macOS arm64 archives.
